plugins {
    id 'com.android.application'
}

android {
    namespace 'com.omoipassion.viton'
    compileSdk 36

    defaultConfig {
        applicationId 'com.omoipassion.viton'
        minSdk 26          // Android 8.0
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        ndk {
            // armeabi-v7a is required: many Android 8 devices run a 32-bit userspace.
            // x86_64 is only for the emulator; drop it for release bundles if size matters.
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildFeatures {
        viewBinding true
    }

    lint {
        // Play rejects native libs without 16 KB page alignment; fail the build, not just warn.
        error.add('Aligned16KB')
    }

    androidResources {
        // Models must stay uncompressed so they can be memory-mapped.
        noCompress 'tflite', 'task'
    }
}

dependencies {
    def camerax = '1.4.2'
    def litert = '1.4.2'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'

    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    implementation "com.google.ai.edge.litert:litert:$litert"
    implementation "com.google.ai.edge.litert:litert-gpu:$litert"
    implementation "com.google.ai.edge.litert:litert-gpu-api:$litert"

    implementation 'com.google.mediapipe:tasks-vision:1.0.0'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
