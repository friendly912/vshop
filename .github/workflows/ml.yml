name: ML

on:
  push:
    branches: [main]
    paths: ['ml/**', '.github/workflows/ml.yml']
  pull_request:
    paths: ['ml/**', '.github/workflows/ml.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ml/requirements-train.txt

      - name: Install dependencies
        run: pip install -r ml/requirements-train.txt

      # Pose/segmenter models are downloaded by vton.preprocess on first use.
      - name: Run tests
        run: python -m pytest ml/tests -v
