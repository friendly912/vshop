name: ML

on:
  push:
    branches: [main]
    paths: ['ml/**', '.github/workflows/ml.yml']
  pull_request:
    paths: ['ml/**', '.github/workflows/ml.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ml/requirements-train.txt

      # MediaPipe's Python package loads EGL/GLES even for CPU-only tasks.
      - name: Install system libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libegl1 libgles2

      - name: Install dependencies
        run: pip install -r ml/requirements-train.txt

      # Pose/segmenter models are downloaded by vton.preprocess on first use.
      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest ml/tests -v -rfE --tb=short 2>&1 | tee pytest.log

      # Surface failures as annotations, visible on the run page without opening logs.
      - name: Annotate failures
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " pytest.log | head -20 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          grep -E "^E +" pytest.log | head -10 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
