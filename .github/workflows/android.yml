name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements.txt

      # Try-on model: DM-VTON converted to LiteRT (CC BY-NC-SA 4.0, see ml/vton/dmvton.py).
      # Cached by conversion inputs; only re-converted when those change.
      - name: Cache converted DM-VTON model
        id: dmvton-cache
        uses: actions/cache@v4
        with:
          path: build/dmvton
          key: dmvton-5dcd04e-${{ hashFiles('ml/export_dmvton.py', 'ml/vton/dmvton.py', 'ml/vton/mobile_ops.py', 'ml/requirements-convert.txt') }}

      - name: Convert DM-VTON to LiteRT
        if: steps.dmvton-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p build/dmvton
          exec > >(tee build/dmvton/convert.log) 2>&1
          python -m venv /tmp/convert
          /tmp/convert/bin/pip install -q -r ml/requirements-convert.txt
          mkdir -p ml/.cache/DM-VTON && cd ml/.cache/DM-VTON
          git init -q && git remote add origin https://github.com/KiseKloset/DM-VTON.git
          git fetch -q --depth 1 origin 5dcd04ee3f5b1fb392df1184c887c1a7e910c72e && git checkout -q FETCH_HEAD
          cd "$GITHUB_WORKSPACE"
          /tmp/convert/bin/python -m gdown --folder https://drive.google.com/drive/folders/1wfWGsR0vWC5LrA26xhj92ec_GoCKV80A -O ml/.cache/dmvton_ckpt
          /tmp/convert/bin/python ml/export_dmvton.py --out build/dmvton/viton_dm.tflite --report build/dmvton/report.json

      - name: Annotate conversion failure
        if: failure() && steps.dmvton-cache.outputs.cache-hit != 'true'
        run: |
          grep -vE "^\s*$|Warning|warn\(" build/dmvton/convert.log | tail -15 | while IFS= read -r l; do echo "::error::${l:0:400}"; done

      - name: Report DM-VTON conversion
        run: |
          python -c "import json; r=json.load(open('build/dmvton/report.json')); print(f\"::notice title=DM-VTON LiteRT::{r['bytes']/1e6:.1f} MB, max abs err {r['max_abs_err']:.2e}, cpu ms {[c['cpu_ms'] for c in r['checks']]}, ops {r['ops']}\")"
          cp build/dmvton/viton_dm.tflite android/app/src/main/assets/models/viton_c.tflite

      - name: Export device benchmark model
        run: python ml/export_bench_model.py --out android/app/src/main/assets/models

      - name: Build warp spike models
        run: python ml/warp_spike/build_warp_models.py

      - name: Download MediaPipe models (pose, multiclass segmenter)
        working-directory: android/app/src/main/assets/models
        run: |
          curl -fsSL --retry 5 -o pose_landmarker_lite.task \
            https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task
          curl -fsSL --retry 5 -o selfie_multiclass_256x256.tflite \
            https://storage.googleapis.com/mediapipe-models/image_segmenter/selfie_multiclass_256x256/float32/latest/selfie_multiclass_256x256.tflite

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK, run unit tests and lint
        working-directory: android
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --console=plain

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ github.sha }}
          path: android/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload warp spike results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warp-spike-${{ github.sha }}
          path: ml/warp_spike/results/
          if-no-files-found: ignore
