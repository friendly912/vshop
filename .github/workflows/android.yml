name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: ml/requirements.txt

      - name: Install Python dependencies
        run: pip install -r ml/requirements.txt

      # Models are git-ignored; generate them so the APK is test-ready.
      - name: Generate placeholder try-on models
        run: python ml/export_placeholder_model.py --out android/app/src/main/assets/models

      - name: Build warp spike models
        run: python ml/warp_spike/build_warp_models.py

      - name: Download pose model
        run: >
          curl -fsSL --retry 5 -o android/app/src/main/assets/models/pose_landmarker_lite.task
          https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/latest/pose_landmarker_lite.task

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK and run lint
        working-directory: android
        run: ./gradlew assembleDebug lintDebug --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report-${{ github.sha }}
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

      - name: Upload warp spike results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warp-spike-${{ github.sha }}
          path: ml/warp_spike/results/
          if-no-files-found: ignore
